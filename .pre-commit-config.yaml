# Pinned hook revisions. Terraform, TFLint, Checkov, and Gitleaks use the
# same config files as GitHub Actions (.tflint.hcl, .checkov.yaml, .gitleaks.toml).
default_install_hook_types: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.4
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args:
          - --hook-config=--retry-once-with-cleanup=true
          - --tf-init-args=-backend=false
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
          - --args=--format=compact

  # Whole-repo scan with the same flags CI's checkov-action uses.
  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.4.3
    hooks:
      - id: checkov
        args:
          - --config-file
          - .checkov.yaml
          - --framework
          - terraform
          - --quiet
          - --compact
        pass_filenames: false

  # Official hook is `gitleaks git --pre-commit --staged`, which scans an empty
  # index on `pre-commit run --all-files`. Override to a full-tree scan that
  # still loads .gitleaks.toml (same allowlist as CI).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        entry: gitleaks detect --source=. --verbose --redact --config=.gitleaks.toml
        pass_filenames: false
