# Checkov configuration
# Skips are limited to checks that are either not applicable or would make
# the lab undeployable. Each entry has a one-line reason.

framework:
  - terraform

skip-check:
  # Local module sources cannot be version-pinned (CKV_TF_1).
  - CKV_TF_1
  # Auto-accept is required for RAM-shared TGW attachments from org accounts (also annotated on the resource).
  - CKV_AWS_331
  # DNSSEC is not supported on Route 53 private hosted zones.
  - CKV2_AWS_38
  # Availability zones are selected via data.aws_availability_zones so the same code runs in any region.
  - CKV_AWS_394
  # Detailed monitoring doubles CloudWatch metric cost for lab instances that exist only for ping tests.
  - CKV_AWS_126
  # KMS key policies must use Resource "*" for the key being defined; access is limited by principal and encryption context.
  - CKV_AWS_109
  - CKV_AWS_111
  - CKV_AWS_356
  # Query logging for private zones is optional; enabling it is a CloudWatch cost with no segmentation signal.
  - CKV2_AWS_39
  # Delete protection would block terraform destroy of this lab stack.
  - CKV_AWS_344
  # Router EIP is associated to the public ENI (dual-homed instance); Checkov only detects instance-id association.
  - CKV2_AWS_19

compact: true
quiet: true
